name: terraform-apply

# Apply on merge to main, one job per affected stack, each gated behind a
# GitHub Environment named for that wedding.
#
# Shape of a run:
#
#   discover -> plan (produces a plan artifact, no approval needed)
#            -> apply (Environment-gated; applies THAT artifact)
#
# The apply job never re-plans. It applies the exact, reviewed plan file that
# the plan job produced from this same commit, so what a reviewer approved is
# what runs. Re-planning inside apply is how "the plan looked fine" turns into
# a surprise deletion.

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - "*.tf"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Single stack to apply (directory name under envs/), e.g. muskan-sourav"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_BUCKET: imigrate-tfstate

jobs:
  discover:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.set.outputs.stacks }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        name: Compute affected stacks
        env:
          DISPATCH_STACK: ${{ inputs.stack }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${DISPATCH_STACK:-}" ]; then
            if [ ! -d "envs/${DISPATCH_STACK}" ]; then
              echo "::error::envs/${DISPATCH_STACK} does not exist"
              exit 1
            fi
            stacks="${DISPATCH_STACK}"
          else
            # github.event.before is all-zeroes for a branch's first push.
            if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              changed="$(git show --name-only --pretty=format: "${AFTER}")"
            else
              changed="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            fi

            if echo "$changed" | grep -qE '^(modules/|[^/]+\.tf$)'; then
              stacks="$(find envs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
            else
              stacks="$(echo "$changed" | grep -E '^envs/[^/]+/' | cut -d/ -f2 | sort -u || true)"
            fi
          fi

          if [ -z "$stacks" ]; then
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            json="$(echo "$stacks" | jq -R . | jq -sc .)"
            echo "stacks=$json" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------------
  # Produce the plan artifact that apply will consume. Not gated: this job
  # makes no changes, and the reviewer needs to see its output before deciding.
  # -------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.stack }})
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}

    environment:
      name: ${{ matrix.stack }}

    defaults:
      run:
        working-directory: envs/${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff ../..

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          key="$( [ "${{ matrix.stack }}" = "_shared" ] \
            && echo "shared/terraform.tfstate" \
            || echo "weddings/${{ matrix.stack }}/terraform.tfstate" )"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${key}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_msg91_auth_key: ${{ secrets.MSG91_AUTH_KEY }}
          TF_VAR_msg91_template_id: ${{ vars.MSG91_TEMPLATE_ID }}
          TF_VAR_admin_phones: ${{ vars.ADMIN_PHONES }}
          TF_VAR_app_spaces_access_key_id: ${{ secrets.APP_SPACES_ACCESS_KEY_ID }}
          TF_VAR_app_spaces_secret_access_key: ${{ secrets.APP_SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_vpc_uuid: ${{ vars.SHARED_VPC_UUID }}
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Human-readable plan in the log
        run: terraform show -no-color tfplan

      # A saved plan contains resolved secret values in cleartext. Keeping it
      # for one day is enough to hand it to the apply job and no longer.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.stack }}-${{ github.sha }}
          path: envs/${{ matrix.stack }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gated apply. The GitHub Environment named for the stack carries the
  # required reviewers, the wait timer and the stack's secrets.
  # -------------------------------------------------------------------------
  apply:
    name: apply (${{ matrix.stack }})
    needs: [discover, plan]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest

    strategy:
      # Applies are serialised per stack by `concurrency` below, but different
      # stacks are independent and may run together.
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}

    # THE GATE. Configure required reviewers on each Environment in
    # Settings -> Environments. Without that, this is just a label.
    environment:
      name: ${{ matrix.stack }}
      url: ${{ steps.outputs.outputs.app_url }}

    # The DO Spaces backend has no state locking (see README). This is what
    # prevents two applies from racing on the same state file.
    concurrency:
      group: terraform-apply-${{ matrix.stack }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: envs/${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          key="$( [ "${{ matrix.stack }}" = "_shared" ] \
            && echo "shared/terraform.tfstate" \
            || echo "weddings/${{ matrix.stack }}/terraform.tfstate" )"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${key}"

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.stack }}-${{ github.sha }}
          path: envs/${{ matrix.stack }}

      # Applying the saved plan, not re-planning. If the world moved since the
      # plan was taken, Terraform refuses the stale plan rather than silently
      # doing something else -- which is the behaviour we want.
      - name: terraform apply
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform apply -no-color -lock-timeout=5m -auto-approve tfplan

      - name: Collect outputs
        id: outputs
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          url="$(terraform output -raw app_url 2>/dev/null || true)"
          echo "app_url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Applied \`${{ matrix.stack }}\`"
            echo
            [ -n "$url" ] && echo "- Live URL: ${url}"
            fqdn="$(terraform output -raw site_fqdn 2>/dev/null || true)"
            [ -n "$fqdn" ] && echo "- Hostname: \`${fqdn}\`"
            cdn="$(terraform output -raw cdn_endpoint 2>/dev/null || true)"
            [ -n "$cdn" ] && echo "- CDN: \`${cdn}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan file holds cleartext secrets; do not leave it on the runner.
      - name: Shred the plan file
        if: always()
        run: rm -f tfplan
